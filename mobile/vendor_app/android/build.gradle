allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

/*
 * Compatibility fix for legacy Flutter plugins.
 *
 * IMPORTANT:
 * Do not use afterEvaluate here.
 * Some projects may already be evaluated when Gradle reaches this code,
 * which causes:
 *
 * Cannot run Project.afterEvaluate(Closure) when the project is already evaluated
 */
subprojects { project ->

    project.pluginManager.withPlugin("com.android.library") {

        def androidExtension =
            project.extensions.findByName("android")

        if (androidExtension != null) {

            // Force a modern compile SDK for legacy plugin subprojects that
            // still pin an old one in their own build.gradle.
            // (Plugin namespaces are self-declared by the current plugin
            // set; spp_connection_plugin ships its own namespace.)
            if (androidExtension.hasProperty("compileSdk")) {
                androidExtension.compileSdk = 36
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
