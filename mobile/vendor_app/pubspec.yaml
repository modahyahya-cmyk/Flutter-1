name: vendor_app
description: "VendorHub vendor application (store, orders, thermal printing)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_bloc: ^8.1.3
  get_it: ^7.6.0
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.1
  intl: ^0.20.2
  go_router: ^14.2.0
  connectivity_plus: ^6.0.5
  internet_connection_checker: ^1.0.0
  equatable: ^2.0.5
  # Bluetooth Serial Port Profile (classic BT) for ESC/POS thermal
  # printers. Replaces the abandoned flutter_bluetooth_serial plugin.
  spp_connection_plugin: ^0.0.9
  esc_pos_utils: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
