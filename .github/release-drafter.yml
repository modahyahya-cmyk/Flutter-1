# Release Drafter configuration.
# Generates a draft GitHub release from conventional commit prefixes.
categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'refactor'
      - 'docs'
  - title: '🔒 Security'
    labels:
      - 'security'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'

template: |
  # What's Changed

  $CHANGES

  ## Contributors

  $CONTRIBUTORS

  This automated release is generated by [Release Drafter](https://github.com/release-drafter/release-drafter).

version-template: $MAJOR.$MINOR.$PATCH
