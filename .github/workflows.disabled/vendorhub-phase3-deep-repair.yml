name: VendorHub Phase 3 - Deep Flutter Android Repair

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Flutter information
        run: |
          flutter --version
          dart --version

      - name: Verify applications
        run: |
          test -f mobile/customer_app/pubspec.yaml
          test -f mobile/vendor_app/pubspec.yaml
          test -f mobile/driver_app/pubspec.yaml

      - name: Repair vendor Android project
        working-directory: mobile/vendor_app
        run: |
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.vendorhub \
              --project-name vendor_app \
              .
          else
            echo "Vendor Android project already exists."
          fi

      - name: Resolve customer dependencies
        working-directory: mobile/customer_app
        run: flutter pub get

      - name: Resolve vendor dependencies
        working-directory: mobile/vendor_app
        run: flutter pub get

      - name: Resolve driver dependencies
        working-directory: mobile/driver_app
        run: flutter pub get

      - name: Generate driver source code
        working-directory: mobile/driver_app
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "build_runner is not declared."
          fi

      - name: Verify generated Driver code
        run: |
          if grep -q "isar_generator" mobile/driver_app/pubspec.yaml; then
            COUNT=$(find mobile/driver_app \
              -type f \
              -name '*.g.dart' \
              ! -path '*/.dart_tool/*' \
              ! -path '*/build/*' \
              | wc -l)

            echo "Generated .g.dart files: $COUNT"

            test "$COUNT" -gt 0
          fi

      - name: Verify Android projects
        run: |
          test -f mobile/customer_app/android/settings.gradle \
            || test -f mobile/customer_app/android/settings.gradle.kts

          test -f mobile/vendor_app/android/settings.gradle \
            || test -f mobile/vendor_app/android/settings.gradle.kts

          test -f mobile/driver_app/android/settings.gradle \
            || test -f mobile/driver_app/android/settings.gradle.kts

      - name: Verify lockfiles
        run: |
          test -f mobile/customer_app/pubspec.lock
          test -f mobile/vendor_app/pubspec.lock
          test -f mobile/driver_app/pubspec.lock

      - name: Analyze Customer
        working-directory: mobile/customer_app
        run: flutter analyze --no-fatal-infos

      - name: Analyze Vendor
        working-directory: mobile/vendor_app
        run: flutter analyze --no-fatal-infos

      - name: Analyze Driver
        working-directory: mobile/driver_app
        run: flutter analyze --no-fatal-infos

      - name: Run Customer tests
        working-directory: mobile/customer_app
        run: flutter test

      - name: Run Vendor tests
        working-directory: mobile/vendor_app
        run: flutter test

      - name: Run Driver tests
        working-directory: mobile/driver_app
        run: flutter test

      - name: Final repository validation
        run: |
          git diff --check

          test -f mobile/customer_app/pubspec.lock
          test -f mobile/vendor_app/pubspec.lock
          test -f mobile/driver_app/pubspec.lock

          test -f mobile/customer_app/android/settings.gradle \
            || test -f mobile/customer_app/android/settings.gradle.kts

          test -f mobile/vendor_app/android/settings.gradle \
            || test -f mobile/vendor_app/android/settings.gradle.kts

          test -f mobile/driver_app/android/settings.gradle \
            || test -f mobile/driver_app/android/settings.gradle.kts

      - name: Commit repaired project
        run: |
          git config user.name "VendorHub CI"
          git config user.email "actions@github.com"

          git add \
            mobile/customer_app \
            mobile/vendor_app \
            mobile/driver_app

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No repair changes to commit."
          else
            git commit -m "fix: complete VendorHub phase 3 deep repair"
            git push origin HEAD:main
          fi
