name: Backend Tests

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
    branches:
      - main
      # TEMPORARY (verification): allow the session branch to run this
      # workflow once; remove after the first green run.
      - arena/01a081c7-flutter-1
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Tests & Route Map
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # composer.json pins config.platform.php to 8.4.1, so match it.
          php-version: '8.4'
          coverage: none
          extensions: mbstring, dom, curl, libxml, bcmath, sqlite3

      - name: Prepare test environment
        # Before composer: post-autoload-dump runs `artisan package:discover`,
        # which boots the app and needs a valid .env / APP_KEY.
        # The key is generated with plain PHP - `artisan key:generate`
        # would already require vendor/, which composer installs next.
        run: |
          cp .env.example .env
          KEY="base64:$(php -r 'echo base64_encode(random_bytes(32));')"
          sed -i "s|^APP_KEY=.*|APP_KEY=${KEY}|" .env
        # phpunit.xml already pins sqlite :memory:, JWT_SECRET and a test
        # APP_KEY, so this only satisfies app bootstrap for route:list.

      - name: Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run test suite
        id: test
        continue-on-error: true
        run: |
          php artisan test > test_report.txt 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            {
              echo '## php artisan test (failed)'
              echo '```'
              tail -c 60000 test_report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Sanity - route map renders
        id: routes
        continue-on-error: true
        run: |
          php artisan route:list > routes_report.txt 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            {
              echo '## php artisan route:list (failed)'
              echo '```'
              tail -c 20000 routes_report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status
