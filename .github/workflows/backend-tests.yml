name: Backend Tests

on:
  push:
    paths:
      - 'backend/**'
    branches:
      - main
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  test:
    name: Tests & Route Map
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, dom, curl, libxml, bcmath, sqlite3

      - name: Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
        # phpunit.xml already pins sqlite :memory:, JWT_SECRET and a test
        # APP_KEY, so this only satisfies app bootstrap for route:list.

      - name: Run test suite
        run: php artisan test

      - name: Sanity: route map renders
        run: php artisan route:list
