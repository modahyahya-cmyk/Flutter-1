name: ZZ Branch Check
on:
  push:
    branches:
      - arena/01a081c7-flutter-1
jobs:
  echo:
    name: Tests & Route Map
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, dom, curl, libxml, bcmath, sqlite3
      - name: Echo
        run: echo "step works"
